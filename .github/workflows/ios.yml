
name: Godot iOS IPA Build

on:
  workflow_dispatch:
  push:
    paths:
      - "velocity_godot_phase1_chinese_font.zip"
      - ".github/workflows/ios.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project
        run: |
          set -e
          unzip -q velocity_godot_phase1_chinese_font.zip -d source
          test -f source/velocity/project.godot

      - name: Install Godot
        run: |
          set -e
          curl -L --fail \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip \
            -o godot.zip
          unzip -q godot.zip -d godot
          GODOT="$(find godot -type f -path '*/Contents/MacOS/Godot' | head -n 1)"
          if [ -z "$GODOT" ]; then
            GODOT="$(find godot -type f -name Godot | head -n 1)"
          fi
          test -x "$GODOT"
          echo "GODOT=$GODOT" >> "$GITHUB_ENV"

      - name: Install export templates
        run: |
          set -e
          curl -L --fail \
            https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz \
            -o templates.tpz
          mkdir -p "$HOME/Library/Application Support/Godot/export_templates/4.3.stable"
          unzip -oq templates.tpz -d templates
          cp -R templates/templates/. \
            "$HOME/Library/Application Support/Godot/export_templates/4.3.stable/"

      - name: Import project
        run: |
          set -e
          "$GODOT" --headless --path source/velocity --editor --quit

      - name: Create iOS export preset
        run: |
          cat > source/velocity/export_presets.cfg <<'EOF'
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/velocity.zip"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          application/app_store_team_id="ABCDE12345"
          application/bundle_identifier="com.example.velocity"
          EOF

      - name: Export iOS Xcode project
        run: |
          set -e
          mkdir -p build
          "$GODOT" --headless --path source/velocity \
            --export-debug "iOS" build/velocity.zip
          test -f build/velocity.zip

      - name: Build unsigned iOS app
        run: |
          set -e
          mkdir -p build/xcode
          unzip -q build/velocity.zip -d build/xcode

          PROJECT="$(find build/xcode -name '*.xcodeproj' -type d | head -n 1)"
          test -n "$PROJECT"

          xcodebuild -list -json -project "$PROJECT" > build/xcode-list.json

          SCHEME="$(python3 -c \
            'import json; d=json.load(open("build/xcode-list.json")); print(d["project"]["schemes"][0])')"
          test -n "$SCHEME"

          xcodebuild \
            -project "$PROJECT" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$PWD/build/derived" \
            CODE_SIGNING_ALLOWED=NO \
            build

          APP="$(find build/derived/Build/Products/Debug-iphoneos -maxdepth 1 -name '*.app' -type d | head -n 1)"
          test -n "$APP"

          mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          cd build/ipa
          zip -qry ../velocity-unsigned.ipa Payload

      - name: Upload IPA and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocity-ios-output
          path: |
            build/velocity.zip
            build/velocity-unsigned.ipa
            build/xcode-list.json
          if-no-files-found: warn
