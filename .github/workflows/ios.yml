
name: Build Velocity iOS IPA

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-14
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check certificate secrets
        env:
          P12_BASE64: ${{ secrets.IOS_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e

          if [ -z "$P12_BASE64" ]; then
            echo "ERROR: 请在 GitHub Secrets 设置 IOS_P12_BASE64"
            exit 1
          fi

          if [ -z "$P12_PASSWORD" ]; then
            echo "ERROR: 请在 GitHub Secrets 设置 IOS_P12_PASSWORD"
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/signing"

          printf '%s' "$P12_BASE64" \
            | base64 --decode \
            > "$RUNNER_TEMP/signing/certificate.p12"

          if [ ! -s "$RUNNER_TEMP/signing/certificate.p12" ]; then
            echo "ERROR: P12 文件解码失败"
            exit 1
          fi

          echo "P12 文件已读取"

      - name: Detect Team ID from certificate
        env:
          P12_PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          TEAM_ID_SECRET: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -e

          CERT="$RUNNER_TEMP/signing/certificate.p12"

          if [ -n "$TEAM_ID_SECRET" ]; then
            TEAM_ID="$TEAM_ID_SECRET"
          else
            openssl pkcs12 \
              -in "$CERT" \
              -clcerts \
              -nokeys \
              -passin env:P12_PASSWORD \
              -out "$RUNNER_TEMP/signing/certificate.pem"

            SUBJECT="$(openssl x509 \
              -in "$RUNNER_TEMP/signing/certificate.pem" \
              -noout -subject -nameopt RFC2253)"

            echo "已读取证书主题"

            TEAM_ID="$(printf '%s' "$SUBJECT" \
              | tr ',' '\n' \
              | sed -n 's/^OU=\([A-Z0-9]\{10\}\)$/\1/p' \
              | head -1)"

            if [ -z "$TEAM_ID" ]; then
              echo "ERROR: 无法从证书自动识别 10 位 Team ID。"
              echo "如果你知道证书所属的真实 Team ID，请添加 APPLE_TEAM_ID Secret 后重试。"
              exit 1
            fi
          fi

          if ! printf '%s' "$TEAM_ID" | grep -Eq '^[A-Z0-9]{10}$'; then
            echo "ERROR: Team ID 格式不正确，必须是 10 位字母或数字。"
            exit 1
          fi

          echo "APPLE_TEAM_ID=$TEAM_ID" >> "$GITHUB_ENV"
          echo "已取得 Team ID"

      - name: Extract Godot project
        run: |
          set -e

          ZIP_FILE="$GITHUB_WORKSPACE/velocity_godot_phase1_chinese_font.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ERROR: 仓库根目录找不到 velocity_godot_phase1_chinese_font.zip"
            ls -la "$GITHUB_WORKSPACE"
            exit 1
          fi

          mkdir -p "$GITHUB_WORKSPACE/source"
          mkdir -p "$GITHUB_WORKSPACE/build"

          unzip -o "$ZIP_FILE" -d "$GITHUB_WORKSPACE/source"

          PROJECT_FILE="$(find "$GITHUB_WORKSPACE/source" \
            -name project.godot -print -quit)"

          if [ -z "$PROJECT_FILE" ]; then
            echo "ERROR: ZIP 中找不到 project.godot"
            exit 1
          fi

          PROJECT_DIR="$(dirname "$PROJECT_FILE")"
          echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"

          echo "已找到 Godot 项目"

      - name: Download Godot 4.3
        run: |
          set -e

          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_macos.universal.zip" \
            -o "$RUNNER_TEMP/godot.zip"

          mkdir -p "$RUNNER_TEMP/godot-bin"
          unzip -o "$RUNNER_TEMP/godot.zip" \
            -d "$RUNNER_TEMP/godot-bin"

          GODOT_BIN="$(find "$RUNNER_TEMP/godot-bin" \
            -type f -path '*/Contents/MacOS/Godot' -print -quit)"

          if [ -z "$GODOT_BIN" ]; then
            GODOT_BIN="$(find "$RUNNER_TEMP/godot-bin" \
              -type f -name Godot -print -quit)"
          fi

          if [ -z "$GODOT_BIN" ]; then
            echo "ERROR: 找不到 Godot 可执行文件"
            find "$RUNNER_TEMP/godot-bin" -maxdepth 5 -print
            exit 1
          fi

          chmod +x "$GODOT_BIN"
          echo "GODOT=$GODOT_BIN" >> "$GITHUB_ENV"

          "$GODOT_BIN" --version

      - name: Install Godot export templates
        run: |
          set -e

          curl -fL \
            "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz" \
            -o "$RUNNER_TEMP/templates.tpz"

          mkdir -p "$RUNNER_TEMP/template-extract"

          unzip -o "$RUNNER_TEMP/templates.tpz" \
            -d "$RUNNER_TEMP/template-extract"

          TEMPLATE_DIR="$(find "$RUNNER_TEMP/template-extract" \
            -type d -name templates -print -quit)"

          if [ -z "$TEMPLATE_DIR" ]; then
            TEMPLATE_DIR="$RUNNER_TEMP/template-extract"
          fi

          DEST="$HOME/Library/Application Support/Godot/export_templates/4.3.stable"

          mkdir -p "$DEST"
          cp -R "$TEMPLATE_DIR"/. "$DEST/"

      - name: Generate iOS icons
        run: |
          set -e

          python3 -m venv "$RUNNER_TEMP/ios-venv"
          "$RUNNER_TEMP/ios-venv/bin/python" -m pip install Pillow

          ICON_DIR="$PROJECT_DIR/assets/icons"
          mkdir -p "$ICON_DIR"

          "$RUNNER_TEMP/ios-venv/bin/python" - "$ICON_DIR" <<'PY'
          from PIL import Image, ImageDraw
          import os
          import sys

          out = sys.argv[1]
          img = Image.new("RGB", (1024, 1024), (18, 28, 48))
          draw = ImageDraw.Draw(img)

          draw.rounded_rectangle(
              (112, 112, 912, 912),
              radius=180,
              fill=(30, 100, 160)
          )
          draw.ellipse(
              (272, 272, 752, 752),
              outline=(255, 255, 255),
              width=32
          )
          draw.ellipse(
              (382, 382, 642, 642),
              outline=(255, 210, 70),
              width=32
          )
          draw.line(
              (512, 220, 512, 804),
              fill=(255, 255, 255),
              width=18
          )
          draw.line(
              (220, 512, 804, 512),
              fill=(255, 255, 255),
              width=18
          )

          sizes = {
              "iphone_120.png": 120,
              "iphone_180.png": 180,
              "ipad_76.png": 76,
              "ipad_152.png": 152,
              "ipad_167.png": 167,
              "app_store_1024.png": 1024,
          }

          for name, size in sizes.items():
              img.resize(
                  (size, size),
                  Image.Resampling.LANCZOS
              ).save(os.path.join(out, name))
          PY

      - name: Import Godot project
        run: |
          set -e

          "$GODOT" --headless --editor \
            --path "$PROJECT_DIR" \
            --quit

      - name: Create iOS export preset
        run: |
          set -e

          cat > "$PROJECT_DIR/export_presets.cfg" <<PRESET
          [preset.0]

          name="iOS"
          platform="iOS"
          runnable=false
          dedicated_server=false
          custom_features=""
          export_filter="all_resources"
          include_filter=""
          exclude_filter=""
          export_path="build/velocity.zip"
          encryption_include_filters=""
          encryption_exclude_filters=""
          encrypt_pck=false
          encrypt_directory=false

          [preset.0.options]

          application/app_store_team_id="$APPLE_TEAM_ID"
          application/bundle_identifier="com.example.velocity"
          application/export_project_only=true
          icons/iphone_120x120="res://assets/icons/iphone_120.png"
          icons/iphone_180x180="res://assets/icons/iphone_180.png"
          icons/ipad_76x76="res://assets/icons/ipad_76.png"
          icons/ipad_152x152="res://assets/icons/ipad_152.png"
          icons/ipad_167x167="res://assets/icons/ipad_167.png"
          icons/app_store_1024x1024="res://assets/icons/app_store_1024.png"
          PRESET

      - name: Export iOS Xcode project
        run: |
          set -e

          "$GODOT" --headless \
            --path "$PROJECT_DIR" \
            --export-debug "iOS" \
            "$GITHUB_WORKSPACE/build/velocity.zip"

          test -s "$GITHUB_WORKSPACE/build/velocity.zip"

      - name: Extract Xcode project
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/build/xcode"

          unzip -o "$GITHUB_WORKSPACE/build/velocity.zip" \
            -d "$GITHUB_WORKSPACE/build/xcode"

          XCODEPROJ="$(find "$GITHUB_WORKSPACE/build/xcode" \
            -name '*.xcodeproj' -print -quit)"

          if [ -z "$XCODEPROJ" ]; then
            echo "ERROR: 导出 ZIP 中没有 Xcode 项目"
            find "$GITHUB_WORKSPACE/build/xcode" -maxdepth 5 -print
            exit 1
          fi

          echo "XCODEPROJ=$XCODEPROJ" >> "$GITHUB_ENV"

      - name: Build unsigned iOS app
        run: |
          set -e

          xcodebuild \
            -list \
            -project "$XCODEPROJ" \
            > "$GITHUB_WORKSPACE/build/xcode-list.txt" 2>&1 || true

          cat "$GITHUB_WORKSPACE/build/xcode-list.txt"

          SCHEME="$(/usr/libexec/PlistBuddy \
            -c 'Print :CFBundleName' \
            "$PROJECT_DIR/project.godot" 2>/dev/null || true)"

          SCHEME="$(basename "$XCODEPROJ" .xcodeproj)"

          xcodebuild \
            -project "$XCODEPROJ" \
            -scheme "$SCHEME" \
            -configuration Debug \
            -sdk iphoneos \
            -derivedDataPath "$GITHUB_WORKSPACE/build/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

          APP_PATH="$(find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
            -maxdepth 5 -type d -name '*.app' -print -quit)"

          if [ -z "$APP_PATH" ]; then
            echo "ERROR: Xcode 没有生成 .app"
            find "$GITHUB_WORKSPACE/build/DerivedData/Build/Products" \
              -maxdepth 5 -print
            exit 1
          fi

          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"

      - name: Package IPA
        run: |
          set -e

          mkdir -p "$GITHUB_WORKSPACE/build/ipa/Payload"
          cp -R "$APP_PATH" "$GITHUB_WORKSPACE/build/ipa/Payload/"

          cd "$GITHUB_WORKSPACE/build/ipa"

          zip -r "$GITHUB_WORKSPACE/build/velocity-unsigned.ipa" Payload

          test -s "$GITHUB_WORKSPACE/build/velocity-unsigned.ipa"
          ls -lh "$GITHUB_WORKSPACE/build/velocity-unsigned.ipa"

      - name: Upload IPA and diagnostic files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: velocity-ios-output
          path: |
            build/velocity-unsigned.ipa
            build/velocity.zip
            build/xcode-list.txt
          if-no-files-found: warn
          retention-days: 7

      - name: Clean up certificate
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/signing"
